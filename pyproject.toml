[project]
name = "beda-inbound-orchestrator"
version = "0.1.0"
description = "Reference implementation of an inbound business inquiry router with deterministic policy and HITL approval."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
